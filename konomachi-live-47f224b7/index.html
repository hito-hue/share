<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="広告ライブ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f6fa">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>広告ライブダッシュボード</title>
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--line:#e4e8f0;--ink:#0f172a;--sub:#5b6476;--mute:#9aa3b2;
  --blue:#2563eb;--blue-soft:#e8efff;--teal:#0d9488;--teal-soft:#e0f5f2;--amber:#d97706;--red:#dc2626;--green:#16a34a;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"palt"}
.num{font-family:"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:600}
h1{font-size:20px;line-height:1.35;margin:4px 0 0;font-weight:700}
.camp{font-size:12px;color:var(--sub);margin-top:4px;word-break:break-all}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-weight:700;font-size:12px;background:var(--blue-soft);color:var(--blue)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pill.live{background:#e7f8ee;color:var(--green)}.pill.live i{animation:pulse 1.6s infinite}
.pill.wait{background:#fff4e5;color:var(--amber)}.pill.stop{background:#fdecec;color:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(6,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.kpi .lb{font-size:12px;color:var(--sub);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;margin-top:6px;line-height:1.1}
.kpi .v small{font-size:13px;font-weight:600;color:var(--sub);margin-left:2px}
.kpi .d{font-size:11.5px;color:var(--mute);margin-top:8px}
.kpi.main{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border:none}
.kpi.main .lb,.kpi.main .d,.kpi.main .v small{color:rgba(255,255,255,.78)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.sec h2{font-size:15px;margin:0;font-weight:700}
.sec span{font-size:12px;color:var(--mute)}
.two{grid-template-columns:1.25fr 1fr}
.pace .row{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin:6px 0}
.pace .row b{color:var(--ink);font-size:15px}
.bar{height:12px;border-radius:999px;background:#edf0f6;overflow:hidden;position:relative;margin:12px 0 6px}
.bar>span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#3b82f6,#2563eb)}
.bar>em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.month3{grid-template-columns:repeat(3,1fr);gap:10px}
.mini{background:#f8fafd;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mini .lb{font-size:11px;color:var(--sub)}.mini .v{font-size:17px;font-weight:700;margin-top:3px}
svg text{font-family:inherit}
.chart{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--mute);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:11px 10px;border-bottom:1px solid #f0f2f7;text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.nm{white-space:normal;font-weight:600;min-width:180px}
.st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-block}
.st.ACTIVE{background:#e7f8ee;color:var(--green)}.st.PENDING_REVIEW,.st.IN_PROCESS{background:#fff4e5;color:var(--amber)}
.st.PAUSED,.st.CAMPAIGN_PAUSED,.st.ADSET_PAUSED{background:#eef0f4;color:var(--sub)}.st.DISAPPROVED,.st.WITH_ISSUES{background:#fdecec;color:var(--red)}
.best{color:var(--teal);font-weight:700}
.tbl{overflow-x:auto;padding:4px 6px}
.hl{display:grid;grid-template-columns:110px 1fr 56px;align-items:center;gap:10px;font-size:13px;margin:9px 0}
.hl .t{height:10px;border-radius:999px;background:#edf0f6;overflow:hidden}
.hl .t span{display:block;height:100%;border-radius:999px;background:var(--teal)}
.hl .n{text-align:right;color:var(--sub)}
.three{grid-template-columns:repeat(4,1fr)}
.empty{color:var(--mute);font-size:13px;padding:18px 0;text-align:center}
.recent{list-style:none;margin:0;padding:0}
.recent li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #f0f2f7;font-size:13px}
.recent li:last-child{border-bottom:none}
.recent .tm{color:var(--sub)}
.recent .ad{font-size:11.5px;color:var(--mute);margin-top:2px}
.guardc .gtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.guardc .lb{font-size:12px;color:var(--sub);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#e7f8ee;color:var(--green)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.warn{background:#fff4e5;color:var(--amber)}.chip.bad{background:#fdecec;color:var(--red)}
.gv{font-size:30px;font-weight:700;margin-top:8px;line-height:1.1}.gv small{font-size:13px;color:var(--sub);font-weight:600;margin-left:6px}
.gauge{position:relative;height:14px;border-radius:999px;background:#edf0f6;margin:14px 0 24px}
.gauge>span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#4ade80,#16a34a)}
.gauge.warn>span{background:linear-gradient(90deg,#fbbf24,#d97706)}.gauge.over>span{background:linear-gradient(90deg,#f87171,#dc2626)}
.gauge>em{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--red);border-radius:2px}
.gauge>em::after{content:attr(data-l);position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--red);font-weight:700;white-space:nowrap;font-style:normal}
.gnote{font-size:13px;line-height:1.75;color:var(--sub)}.gnote b{color:var(--ink);font-size:15px}
.gnote.over{color:var(--red);font-weight:700}
.galist .it{padding:11px 0;border-bottom:1px solid #f0f2f7}.galist .it:last-child{border-bottom:none}.galist .it:first-child{padding-top:2px}
.galist .h{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;font-weight:600}
.galist .s{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--sub);margin-top:4px;flex-wrap:wrap}
.galist .s b{color:var(--ink)}.galist .s .r{color:var(--amber);font-weight:700}.galist .s .r.ok{color:var(--sub);font-weight:500}
.galist .gauge{height:7px;margin:7px 0 0}.galist .gauge>em{top:-3px;bottom:-3px}
.galist .off{opacity:.55}
.rules{margin-top:16px;padding-top:14px;border-top:1px solid #f0f2f7}
.rl{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--sub);padding:6px 0;line-height:1.5}
.rl b{color:var(--ink);margin-left:4px}.rl .chip{flex:none}
.gfoot{font-size:11.5px;color:var(--mute);margin-top:10px;line-height:1.7}
/* 配信中のバナー（Metaのフィードでの見え方に寄せる） */
.adsg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.adc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.adh{display:flex;align-items:center;gap:8px;padding:10px 11px 8px}
.av{width:30px;height:30px;border-radius:50%;background:#e8efff;color:var(--blue);display:grid;place-items:center;flex:none}
.av svg{width:16px;height:16px}
.adh b{display:block;font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.adh small{font-size:10.5px;color:var(--mute)}
.adh .st{margin-left:auto}
.adb{padding:0 11px 8px;font-size:12px;line-height:1.6;color:var(--ink)}
.adb details summary{list-style:none;cursor:pointer;color:var(--mute);font-size:11.5px;margin-top:2px}
.adb details summary::-webkit-details-marker{display:none}
.adb details[open] summary{display:none}
.adb p{margin:0;white-space:pre-line}
.adi{display:block;aspect-ratio:1/1;background:#eef1f6}.adi img{display:block;width:100%;height:100%;object-fit:cover}
.adf{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#f6f7f9;border-top:1px solid var(--line)}
.adf div{min-width:0;flex:1}.adf small{display:block;font-size:10.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adf b{display:block;font-size:12px;line-height:1.35;margin-top:1px}
.cta{flex:none;font-size:11px;font-weight:700;background:#e4e6eb;color:#050505;border-radius:6px;padding:7px 9px;white-space:nowrap}
.adm{padding:9px 11px 11px;font-size:11.5px;color:var(--sub);border-top:1px solid #f0f2f7;margin-top:auto;line-height:1.6}
.adm b{color:var(--ink)}
.adm .st{flex:none;white-space:nowrap}
/* フォームのプレビュー（スマホの画面を横に並べる） */
.fwrap{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;-webkit-overflow-scrolling:touch}
.fs{flex:0 0 272px;scroll-snap-align:start}
.fs .lbl{font-size:11.5px;color:var(--sub);font-weight:700;margin:0 0 7px 2px}
.fs .lbl span{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:999px;background:var(--blue);color:#fff;font-size:11px;margin-right:6px}
.phone{height:520px;border-radius:22px;border:1px solid #d9dee8;background:#fff;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
.ph-top{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;border-bottom:1px solid #eef0f3;font-size:12.5px;font-weight:700}
.ph-top .x{margin-left:auto;color:#65676b;font-weight:400}
.ph-body{flex:1;overflow:auto;padding:16px 16px 10px;font-size:13px;line-height:1.65;color:#1c1e21}
.ph-body h4{font-size:17px;line-height:1.45;margin:0 0 10px}
.ph-body .q{font-weight:700;font-size:14px;margin:14px 0 10px}
.ph-body .note{font-size:12px;color:#65676b}
.sel{border:1px solid #ccd0d5;border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;color:#65676b;font-size:13px}
.opts{font-size:11.5px;color:#65676b;margin-top:8px;line-height:1.7}
.rad{display:flex;align-items:center;gap:10px;border:1px solid #ccd0d5;border-radius:8px;padding:10px 12px;margin:0 0 8px;font-size:13px}
.rad i{width:16px;height:16px;border-radius:50%;border:1.5px solid #8a8d91;flex:none}
.rad.new{border-color:#f5b54a;background:#fff8ec}
.rad .tag{margin-left:auto;font-size:10px;font-weight:700;color:#b45309;background:#fde7c0;border-radius:4px;padding:1px 6px}
.fld{margin:0 0 12px}.fld label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}.fld label small{font-weight:400;color:#65676b}
.fld div{border:1px solid #ccd0d5;border-radius:8px;padding:9px 12px;color:#8a8d91;font-size:12.5px}
.fld p{margin:4px 0 0;font-size:11px;color:#65676b}
.ph-foot{padding:10px 16px 16px}
.prog{height:4px;border-radius:2px;background:#e4e6eb;overflow:hidden;margin-bottom:10px}.prog i{display:block;height:100%;background:#0866ff}
.fbtn{display:block;text-align:center;background:#0866ff;color:#fff;font-weight:700;font-size:14px;border-radius:8px;padding:10px}
.fbtn.ghost{background:#e4e6eb;color:#050505}
.done{text-align:center;padding-top:40px}.done .ok{width:54px;height:54px;border-radius:50%;background:#e7f3ff;color:#0866ff;display:grid;place-items:center;margin:0 auto 14px}
.done .ok svg{width:26px;height:26px}
.fnote{font-size:11.5px;color:var(--mute);line-height:1.7;margin-top:2px}
@media (max-width:1000px){.adsg{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.adsg{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.adc{flex:0 0 78%;scroll-snap-align:start}.fs{flex-basis:78%}}
.homeadd{margin-top:26px;font-size:12.5px;line-height:1.8;color:var(--sub);background:#f8fafd}
.homeadd b{color:var(--ink);font-size:13px}
@media (display-mode:standalone){.homeadd{display:none}}
footer{margin-top:28px;font-size:11.5px;color:var(--mute);line-height:1.8;text-align:center}
#gate{max-width:420px;margin:18vh auto;text-align:center;color:var(--sub);font-size:14px;line-height:1.8}
.notice{background:#fff8e6;border:1px solid #f6e2b3;color:#7a5200;font-size:12.5px;border-radius:10px;padding:10px 14px;margin-bottom:14px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.three{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.wrap{padding:14px 12px 40px}.kpis{grid-template-columns:repeat(2,1fr);gap:10px}.kpi .v{font-size:22px}.three{grid-template-columns:1fr}.month3{grid-template-columns:repeat(3,1fr)}h1{font-size:17px}.hl{grid-template-columns:90px 1fr 44px}}
</style>

<body>
<div id="gate">読み込んでいます…</div>
<div class="wrap" id="app" hidden></div>
<script>
(() => {
const $app = document.getElementById('app'), $gate = document.getElementById('gate');
const yen = (v) => v == null ? '—' : '¥' + Math.round(v).toLocaleString('ja-JP');
const int = (v) => v == null ? '—' : Math.round(v).toLocaleString('ja-JP');
const pct = (v, d = 2) => v == null ? '—' : (v * 100).toFixed(d) + '%';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STATUS = { ACTIVE: '配信中', PENDING_REVIEW: '審査中', IN_PROCESS: '処理中', PAUSED: '停止', CAMPAIGN_PAUSED: '停止', ADSET_PAUSED: '停止', DISAPPROVED: '不承認', WITH_ISSUES: '要確認' };
const REGION = { Tokyo: '東京都', 'Kanagawa Prefecture': '神奈川県', 'Saitama Prefecture': '埼玉県', 'Chiba Prefecture': '千葉県', 'Ibaraki Prefecture': '茨城県', 'Tochigi Prefecture': '栃木県', 'Gunma Prefecture': '群馬県', 'Yamanashi Prefecture': '山梨県' };
const PLAT = { facebook: 'Facebook', instagram: 'Instagram', whatsapp: 'WhatsApp', audience_network: 'Audience Network', messenger: 'Messenger', threads: 'Threads' };

// 鍵なしで開ける（2026-11-25 伊藤さん「開けないって。鍵なしでいい」）
// ・鍵は公開のとき push.mjs がページに埋め込む（__EMBED_KEY__ を置き換え）＝URLに鍵は要らない
//   ※実質だれでも見られる。暗号化を残すのは、公開リポジトリに数字をそのまま置かない（検索に出さない）ためだけ
// ・前の「#k=…」「?k=…」付きのリンクもそのまま開ける（URLの鍵は使わず、アドレス欄からは消す）
const EMBED_KEY = '8-CbrAdadV4oPXBciGfiXFVsI33c5u7Kc215iCVgo94';
function keyFromHash() {
  const k = /^[A-Za-z0-9_-]{20,}$/.test(EMBED_KEY) ? EMBED_KEY : null;
  if (!k) return null;
  const b = atob(k.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((k.length + 3) % 4));
  return Uint8Array.from(b, (c) => c.charCodeAt(0));
}
function rememberKey() {
  if (/k=/.test(location.search + location.hash)) {
    try { history.replaceState(null, '', location.pathname); } catch {}
  }
}
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
let cryptoKey;
async function load() {
  const raw = keyFromHash();
  if (!raw) throw new Error('nokey');
  cryptoKey ||= await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('fetch');
  const e = await r.json();
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(e.iv) }, cryptoKey, unb64(e.ct));
  rememberKey(); // 古い鍵付きリンクで来たら、アドレス欄を鍵なしの形にそろえる
  return JSON.parse(new TextDecoder().decode(pt));
}

const niceStep = (v) => { const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; };
const chartW = () => Math.max(320, Math.min(760, Math.min(window.innerWidth, 1180) - 70));
function bars(days, today) {
  const W = chartW(), H = W < 500 ? 200 : 230, P = { l: 46, r: 40, t: 14, b: 30 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b, n = days.length, bw = iw / n;
  const maxS = Math.max(1000, ...days.map((d) => d.spend)), maxL = Math.max(3, ...days.map((d) => d.leads));
  const step = niceStep(maxS / 4), niceS = step * 4;
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const y = P.t + ih - (ih * i) / 4;
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="#eef1f6"/>`;
    g += `<text x="${P.l - 8}" y="${y + 4}" text-anchor="end" font-size="10" fill="#9aa3b2">${(step * i / 1000).toLocaleString('ja-JP', { maximumFractionDigits: 1 })}k</text>`;
    g += `<text x="${W - P.r + 8}" y="${y + 4}" font-size="10" fill="#0d9488">${Math.round(maxL * i / 4)}</text>`;
  }
  let pts = [];
  days.forEach((d, i) => {
    const x = P.l + i * bw, h = (d.spend / niceS) * ih;
    const isT = d.date === today;
    g += `<rect x="${x + bw * 0.18}" y="${P.t + ih - h}" width="${bw * 0.64}" height="${Math.max(h, d.future ? 0 : 0)}" rx="3" fill="${isT ? '#1d4ed8' : '#93b4f5'}"><title>${d.date.slice(5)}  ${yen(d.spend)} / リード${d.leads}</title></rect>`;
    if (!d.future) pts.push([x + bw / 2, P.t + ih - (d.leads / maxL) * ih, d.leads]);
    const day = +d.date.slice(8);
    if (W >= 500 ? (n <= 16 || day === 1 || day % 5 === 0) : (i === 0 || (n <= 16 ? i % 3 === 0 : day % 5 === 0))) g += `<text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#9aa3b2">${day}日</text>`;
  });
  if (pts.length) {
    g += `<polyline points="${pts.map((p) => p[0] + ',' + p[1]).join(' ')}" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-linejoin="round"/>`;
    pts.forEach((p) => { if (p[2] > 0) g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="#fff" stroke="#0d9488" stroke-width="2"/>`; });
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="日別の消化金額とリード">${g}</svg>`;
}
function hoursChart(hours, nowH) {
  const W = chartW(), H = W < 500 ? 150 : 170, P = { l: 40, r: 12, t: 12, b: 26 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b, bw = iw / 24;
  const maxS = Math.max(500, ...hours.map((h) => h.spend));
  let g = `<line x1="${P.l}" x2="${W - P.r}" y1="${P.t + ih}" y2="${P.t + ih}" stroke="#e4e8f0"/>`;
  hours.forEach((h, i) => {
    const x = P.l + i * bw, bh = (h.spend / maxS) * ih;
    g += `<rect x="${x + bw * 0.2}" y="${P.t + ih - bh}" width="${bw * 0.6}" height="${bh}" rx="2.5" fill="${i === nowH ? '#1d4ed8' : '#bcd0f8'}"><title>${i}時台  ${yen(h.spend)} / 表示${int(h.imp)} / リード${h.leads}</title></rect>`;
    if (h.leads > 0) g += `<text x="${x + bw / 2}" y="${P.t + ih - bh - 5}" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488">${h.leads}</text>`;
    if (i % (W < 500 ? 6 : 3) === 0) g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#9aa3b2">${i}時</text>`;
  });
  g += `<text x="${P.l - 6}" y="${P.t + 8}" text-anchor="end" font-size="10" fill="#9aa3b2">${(maxS / 1000).toFixed(1)}k</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="今日の時間帯別">${g}</svg>`;
}
function hlist(rows, label = (r) => r[0], val = (r) => r[1], fmt = int) {
  if (!rows.length) return '<div class="empty">まだデータがありません</div>';
  const max = Math.max(...rows.map(val), 1);
  return rows.slice(0, 8).map((r) => `<div class="hl"><div>${esc(label(r))}</div><div class="t"><span style="width:${(val(r) / max) * 100}%"></span></div><div class="n num">${fmt(val(r))}</div></div>`).join('');
}
function kpi(lb, v, unit, d, main) {

// 自動停止ライン（2026-11-26〜）：Metaの自動ルール2本の判定と同じ「配信開始からの通算」で比べる
//  A＝キャンペーン全体のCPAが停止ラインを超えたらキャンペーンごと停止／B＝リード0件のまま停止ライン額を使った広告を停止
function guardHtml(D) {
  const G = D.guard;
  if (!G || !G.campaign) return '';
  const L = G.stopCpa, C = G.campaign, SCALE = 1.25; // メーターの右端＝停止ラインの1.25倍（ラインは8割の位置）
  const tone = (r) => (r > 1 ? 'over' : r >= 0.75 ? 'warn' : '');
  const gauge = (v, label) => { const r = v / L; return `<div class="gauge ${tone(r)}"><span style="width:${Math.min(100, (r / SCALE) * 100)}%"></span><em style="left:${100 / SCALE}%" data-l="${label}"></em></div>`; };
  const on = G.rules.filter((r) => r.on).length;
  const chip = !G.rules.length ? '<span class="chip bad"><i></i>自動停止ルールが見つかりません</span>'
    : on < G.rules.length ? `<span class="chip warn"><i></i>自動停止ルール ${G.rules.length}本中 ${on}本オン</span>`
    : `<span class="chip"><i></i>自動停止ルール ${on}本 オン</span>`;
  const ruleRow = (re, cond, act) => {
    const r = G.rules.find((x) => re.test(x.name));
    const st = !r ? '<span class="chip bad">見つかりません</span>' : r.on ? '<span class="chip">オン</span>' : '<span class="chip warn">オフ</span>';
    return `<div class="rl"><span>${cond}<b>${act}</b></span>${st}</div>`;
  };
  const campOn = C.status === 'ACTIVE';
  const left = C.leads ? L * C.leads - C.spend : null; // リード0件のまま使える額
  const days = left > 0 && D.dailyBudget ? left / D.dailyBudget : null;
  let note;
  if (!campOn && C.status) note = `<div class="gnote over">キャンペーンは停止中です${C.cpa > L ? '（通算CPAが停止ラインを超えたため）' : ''}</div>`;
  else if (!C.leads) note = `<div class="gnote">まだリードがないため、キャンペーン全体の判定は始まっていません（リード0件の広告は1本ずつ ${yen(L)} で停止）</div>`;
  else if (left <= 0) note = `<div class="gnote over">停止ラインを超えています。Metaの次の判定（30分以内）でキャンペーンが止まります</div>`;
  else note = `<div class="gnote">リード0件のまま あと <b class="num">${yen(left)}</b> 使うと、キャンペーン全体が止まります${days ? `<br>（1日${yen(D.dailyBudget)}なら 約${days.toFixed(1)}日分）` : ''}</div>`;
  const risk = (a) => (a.leads ? a.cpa / L : a.spend / L);
  const live = (a) => a.status !== 'PAUSED' && a.status !== 'CAMPAIGN_PAUSED' && a.status !== 'ADSET_PAUSED';
  const ads = [...G.ads].filter((a) => a.spend > 0 || live(a)).sort((a, b) => (live(b) - live(a)) || (risk(b) - risk(a)));
  const row = (a) => {
    const zero = !a.leads, rest = L - a.spend;
    const right = !live(a) ? '<span class="r ok">停止中</span>'
      : zero ? (rest > 0 ? `<span class="r">あと ${yen(rest)} で停止</span>` : '<span class="r" style="color:var(--red)">まもなく停止</span>')
      : '<span class="r ok">全体で判定</span>';
    return `<div class="it${live(a) ? '' : ' off'}"><div class="h"><span>${esc(a.name)}</span><span class="st ${esc(a.status)}">${esc(STATUS[a.status] || a.status)}</span></div>
      <div class="s"><span>通算 <b class="num">${yen(a.spend)}</b>・リード <b class="num">${a.leads}件</b>${zero ? '' : `・CPA <b class="num">${yen(a.cpa)}</b>`}</span>${right}</div>
      ${gauge(zero ? a.spend : a.cpa, '')}</div>`;
  };
  return `
  <div class="sec"><h2>自動停止ライン（${yen(L)}）</h2><span>配信開始からの通算で判定</span></div>
  <div class="grid two">
    <div class="card guardc">
      <div class="gtop"><div class="lb">キャンペーン全体のCPA（通算）</div>${chip}</div>
      <div class="gv num">${yen(C.cpa)}<small>/ 停止ライン ${yen(L)}</small></div>
      ${C.leads ? gauge(C.cpa, '停止 ' + yen(L)) : ''}
      ${note}
      <div class="grid month3" style="margin-top:14px">
        <div class="mini"><div class="lb">通算の消化</div><div class="v num">${yen(C.spend)}</div></div>
        <div class="mini"><div class="lb">通算リード</div><div class="v num">${int(C.leads)}件</div></div>
        <div class="mini"><div class="lb">停止まで残り</div><div class="v num">${left == null ? '—' : yen(Math.max(0, left))}</div></div>
      </div>
      <div class="rules">
        <div class="lb" style="margin-bottom:6px">Metaの自動ルール（30分おきに判定）</div>
        ${ruleRow(/キャンペーン/, `キャンペーン全体のCPAが ${yen(L)} を超えたら`, 'キャンペーンごと停止')}
        ${ruleRow(/成果0件|0件/, `リード0件のまま ${yen(L)} を超えた広告は`, 'その広告だけ停止')}
      </div>
    </div>
    <div class="card guardc">
      <div class="lb" style="margin-bottom:8px">広告ごと（リードがある広告はCPA、0件の広告は使った額を ${yen(L)} と比較）</div>
      <div class="galist">${ads.map(row).join('')}</div>
    </div>
  </div>
  <div class="gfoot">※リードがある広告は1本ずつでは止まりません（キャンペーン全体で判定）。止まったものをそのまま再開すると、通算の数字ですぐにまた止まります。</div>`;
}

  <div class="sec"><h2>今日の時間帯別</h2><span>棒＝消化金額　数字＝リード</span></div>
  <div class="card">${hoursChart(D.hours, nowH)}</div>

  <div class="sec"><h2>広告ごとの成績（今月）</h2><span>CPAがいちばん良い広告を緑で表示</span></div>
  <div class="card tbl"><table>
    <thead><tr><th>広告</th><th>状態</th><th>消化金額</th><th>表示</th><th>クリック率</th><th>リード</th><th>CPA</th><th>今日の消化</th><th>今日のリード</th></tr></thead>
    <tbody>${D.ads.map((a) => `<tr><td class="nm">${esc(a.name)}</td><td><span class="st ${esc(a.status)}">${esc(STATUS[a.status] || a.status)}</span></td><td class="num">${yen(a.month.spend)}</td><td class="num">${int(a.month.imp)}</td><td class="num">${pct(a.month.ctr)}</td><td class="num">${lead(a.month)}</td><td class="num ${a.month.cpa === bestCpa && isFinite(bestCpa) ? 'best' : ''}">${yen(a.month.cpa)}</td><td class="num">${yen(a.today.spend)}</td><td class="num">${lead(a.today)}</td></tr>`).join('')}</tbody>
  </table></div>

  ${bannersHtml(D)}
  ${formHtml()}

  <div class="sec"><h2>媒体別の成績（今月）</h2><span>どちらから来ているか</span></div>
  <div class="card tbl"><table>
    <thead><tr><th>媒体</th><th>リード</th><th>CPA</th><th>消化金額</th><th>表示</th><th>クリック率</th></tr></thead>
    <tbody>${(() => {
      const rows = D.platform.filter((p) => p.spend > 0 || p.leads > 0);
      const bestP = Math.min(...rows.map((p) => p.cpa ?? Infinity));
      return rows.length ? rows.map((p) => `<tr><td class="nm" style="min-width:110px">${esc(PLAT[p.name] || p.name)}</td><td class="num"><b>${lead(p)}</b></td><td class="num ${p.cpa === bestP && isFinite(bestP) && rows.length > 1 ? 'best' : ''}">${yen(p.cpa)}</td><td class="num">${yen(p.spend)}</td><td class="num">${int(p.imp)}</td><td class="num">${pct(p.ctr)}</td></tr>`).join('') : '<tr><td colspan="6"><div class="empty">まだデータがありません</div></td></tr>';
    })()}</tbody>
  </table></div>

  <div class="sec"><h2>どこに届いているか（今月）</h2><span>Metaの集計</span></div>
  <div class="grid three">
    <div class="card"><div class="lb" style="font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px">都県別の消化金額</div>${hlist(D.region, (r) => REGION[r.name] || r.name, (r) => r.spend, yen)}</div>
    <div class="card"><div class="lb" style="font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px">都県別のリード</div>${hlist(D.region.filter((r) => r.leads), (r) => REGION[r.name] || r.name, (r) => r.leads)}</div>
    <div class="card"><div class="lb" style="font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px">年齢別の消化金額</div>${hlist(D.age, (r) => r.name + '歳', (r) => r.spend, yen)}</div>
    <div class="card"><div class="lb" style="font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px">媒体別の消化金額</div>${hlist(D.platform, (r) => PLAT[r.name] || r.name, (r) => r.spend, yen)}</div>
  </div>

  <div class="sec"><h2>届いたお申込みの内訳</h2><span>受付件数 ${int(D.inbox.total)}件（今日 ${int(D.inbox.today)}件）・お名前や電話番号は表示しません</span></div>
  <div class="grid three">
    <div class="card"><div style="font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px">建物の場所</div>${hlist(D.inbox.area)}</div>
    <div class="card"><div style="font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px">建物の状態</div>${hlist(D.inbox.state)}</div>
    <div class="card"><div style="font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px">今の電力会社</div>${hlist(D.inbox.now)}</div>
    <div class="card"><div style="font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px">お電話の希望時間帯</div>${hlist(D.inbox.time)}</div>
  </div>
  <div class="card" style="margin-top:14px"><div style="font-size:12px;color:var(--sub);font-weight:600;margin-bottom:4px">最近のお申込み（新しい順）</div>
    ${D.inbox.recent.length ? `<ul class="recent">${D.inbox.recent.map((r) => `<li><span class="tm num">${esc(r.at)}</span><span>${esc(r.area || '場所未回答')}・${esc(r.state || '状態未回答')}<div class="ad">${esc(r.ad)}</div></span></li>`).join('')}</ul>` : '<div class="empty">まだお申込みはありません</div>'}
  </div>
  <div class="card homeadd"><b>📱 スマホのホーム画面に置けます</b><br>iPhone：画面下の共有ボタン（□に↑）→「ホーム画面に追加」／Android：右上の︙→「ホーム画面に追加」。<br>次からはアイコンをタップするだけで、アプリのように開けます。</div>
  <footer>Metaの数字は15分ほど遅れて反映されます。お申込みの件数は受付サーバーに届いた分（テストは除く）です。<br>このページは関係者向けです。リンクを社外に転送しないでください。</footer>`;
  $app.querySelectorAll('[data-k]').forEach((el) => { const k = keep[el.dataset.k]; if (!k) return; if (k.open) el.open = true; if (k.x) el.scrollLeft = k.x; });
  $app.hidden = false; $gate.hidden = true;
}

let last;
async function tick() {
  try { last = await load(); render(last); }
  catch (e) {
    if (!$app.hidden) return; // 表示済みなら前の数字のまま
    $gate.textContent = '読み込めませんでした。少し待ってから開き直してください。';
  }
}
tick();
setInterval(tick, 60 * 1000);
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => last && render(last), 200); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
})();
</script>
</body>
</html>
