<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ご応募ありがとうございます｜日本買取センター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
:root{--navy:#0E2A4A;--blue:#1F63B6;--blue-lt:#EAF2FB;--line:#E1E7EF;--ink:#15181F;--ink2:#525A6B;--green:#15A34A;--num:"Anton","Noto Sans JP",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--blue-lt);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;line-height:1.75;font-feature-settings:"palt"}
.hd{background:var(--navy);color:#fff;height:56px;display:flex;align-items:center;padding:0 20px}
.hd b{font-size:17px;font-weight:900}
.hd small{display:block;font-size:10px;color:#B9CFEA;letter-spacing:.14em;line-height:1}
main{max-width:560px;margin:0 auto;padding:28px 20px 48px}
.card{background:#fff;border-radius:20px;padding:28px 20px;box-shadow:0 16px 40px rgba(20,23,31,.1);text-align:center}
.ok{width:64px;height:64px;border-radius:50%;background:#E7F6EC;display:grid;place-items:center;margin:0 auto 10px}
.ok svg{width:30px;height:30px;stroke:var(--green);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:23px;margin:0;font-weight:900;line-height:1.4}
.lead{margin:10px 0 0;color:var(--ink2);font-size:14.5px}
.next{list-style:none;margin:22px 0 0;padding:0;text-align:left;display:grid;gap:10px}
.next li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.next .n{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--num);font-size:15px}
.next li:first-child .n{background:var(--green)}
.next b{display:block;font-size:15px}
.next span{display:block;font-size:13px;color:var(--ink2);line-height:1.6}
.tel{margin-top:18px;font-size:13px;color:var(--ink2);background:#F6F9FD;border-radius:12px;padding:12px 14px}
.tel b{display:block;font-size:12px;color:var(--blue)}
.demo{margin-top:22px;font-size:11.5px;color:#7D8DA3;text-align:center}
</style>
</head>
<body>
<header class="hd"><div><small>出張買取</small><b>日本買取センター</b></div></header>
<main>
  <p class="demo" style="margin:0 0 12px">※ご提案用の見本です。情報は保存・送信されていません。</p>
  <div class="card">
    <span class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
    <h1>ご応募ありがとうございます</h1>
    <p class="lead">ご応募を受け付けました。<br>担当者から、ご入力の電話番号にお電話します。</p>
    <ol class="next">
      <li><span class="n">01</span><div><b>担当者からお電話</b><span>知らない番号からの着信は、採用担当の可能性があります。</span></div></li>
      <li><span class="n">02</span><div><b>面接の日程を決める</b><span>尼崎の事務所、またはオンラインで行います。</span></div></li>
      <li><span class="n">03</span><div><b>面接・内定</b><span>内定のご連絡は面接後3日以内です。</span></div></li>
    </ol>
    <p class="tel"><b>お問い合わせ</b>日本買取センター株式会社 採用担当　03-5926-4022</p>
  </div>
  <p class="demo">※このページは広告施策のご提案用イメージです。情報は保存・送信されていません。</p>
</main>
</body>
</html>
